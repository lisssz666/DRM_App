spring:
  main:
    allow-circular-references: true
  application:
    name: drm-sprayer
  datasource:
    url: jdbc:mysql://47.251.245.247:3306/drm_sprayer?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&useAffectedRows=true
    username: root
    password: Admin123!
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
      auto-commit: true
  jpa:
